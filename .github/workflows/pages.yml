# GitHub Pages는 사이트를 하나만 배포할 수 있어서,
# main은 사이트 루트에, preview 브랜치는 /preview/ 아래에 함께 올린다.
# github-pages 환경은 main에서만 배포를 허용하므로 항상 main에서 실행한다.
# preview에 푸시하면 preview-trigger.yml이 이 워크플로를 main에서 다시 실행시킨다.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Check out preview
        uses: actions/checkout@v4
        with:
          ref: preview
          path: site/preview

      - name: Remove git metadata
        run: rm -rf site/.git site/.github site/preview/.git site/preview/.github

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

      # 저장소 Deployments 목록에 Production(main)과 Preview(preview)를
      # 각각의 주소와 함께 띄운다.
      - name: Record Production and Preview deployments
        env:
          GH_TOKEN: ${{ github.token }}
          SITE: ${{ steps.deployment.outputs.page_url }}
          LOG: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          record() {
            local env="$1" ref="$2" url="$3" production="$4"
            id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --jq .id --input - <<JSON
          {"ref": "$ref", "environment": "$env", "description": "GitHub Pages",
           "auto_merge": false, "required_contexts": [],
           "production_environment": $production, "transient_environment": false}
          JSON
            )
            gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
              -f state=success -f environment_url="$url" -f log_url="$LOG" > /dev/null
          }
          record Production main "$SITE" true
          record Preview preview "${SITE}preview/" false
