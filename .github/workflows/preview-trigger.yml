# preview에 푸시하면 main의 Deploy Pages를 실행해서 /preview/를 갱신한다.
name: Deploy preview

on:
  push:
    branches: [preview]

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
